<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Sightline app icon, in the default Graphite theme's colours (a static asset cannot follow the theme).
    The mark is a viewer (the dot) and its field of view (the fan): lines of sight converging on one point.
    Mark geometry is on a 24 grid, identical to src/renderer/src/ui/Logo.tsx, scaled x16 (about 60% of the plate).
    Raster icons: node scripts/build-icons.mjs (sizes of 32 px and below are drawn from icon-small.svg).
  -->
  <defs>
    <linearGradient id="sightline" gradientUnits="userSpaceOnUse" x1="6" y1="18" x2="16.5" y2="7.5">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#8AB4FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#111315"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#2A2E35" stroke-width="4"/>
  <g transform="translate(256 256) scale(16) translate(-12 -12)" fill="url(#sightline)">
    <circle cx="6" cy="18" r="3.6"/>
    <path d="M9.89 14.11L21.24 11.7A11.6 11.6 0 0 0 12.3 2.76Z" stroke="url(#sightline)" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</svg>
